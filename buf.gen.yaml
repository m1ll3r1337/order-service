version: v2

managed:
  enabled: true
  disable:
    - module: buf.build/googleapis/googleapis
  override:
    - file_option: go_package_prefix
      value: github.com/m1ll3r1337/order-service/internal/pkg/grpc/gen

plugins:
  - local: protoc-gen-go
    out: internal/pkg/grpc/gen
    opt: paths=source_relative

  - local: protoc-gen-go-grpc
    out: internal/pkg/grpc/gen
    opt: paths=source_relative
